
name: Gamypad CI/CD

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"

  pull_request:

  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.2.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: gamypad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Gamypad
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare build metadata
        id: meta
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$INPUT_VERSION"

            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid version: $VERSION"
              exit 1
            fi
          else
            VERSION="0.0.0"
          fi

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$GITHUB_REF" == refs/tags/v* ]]; then
            ARTIFACT_SUFFIX="$VERSION"
          else
            ARTIFACT_SUFFIX="ci-${GITHUB_SHA::7}"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "artifact_suffix=$ARTIFACT_SUFFIX" >> "$GITHUB_OUTPUT"

      - name: Create release assets directory
        run: mkdir -p release-assets

      # Java and Flutter

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      # Linux dependencies

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            patchelf \
            desktop-file-utils \
            pkg-config \
            libgtk-3-dev \
            libglib2.0-dev \
            libgirepository1.0-dev \
            gobject-introspection \
            librsvg2-dev \
            libfuse2 \
            fuse \
            libblkid-dev \
            liblzma-dev \
            libgcrypt20-dev

      # AppImage tools

      - name: Download AppImage tools
        run: |
          mkdir -p tools

          curl -fL \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
            -o tools/linuxdeploy

          curl -fL \
            https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh \
            -o tools/linuxdeploy-plugin-gtk.sh

          curl -fL \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            -o tools/appimagetool

          chmod +x tools/linuxdeploy
          chmod +x tools/linuxdeploy-plugin-gtk.sh
          chmod +x tools/appimagetool

          echo "$GITHUB_WORKSPACE/tools" >> "$GITHUB_PATH"

      # Linux build

      - name: Get Linux dependencies
        working-directory: gamypad_pc
        run: flutter pub get

      - name: Build Linux application
        working-directory: gamypad_pc
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD_NUMBER: ${{ steps.meta.outputs.build_number }}
        run: |
          flutter build linux \
            --release \
            --build-name="$VERSION" \
            --build-number="$BUILD_NUMBER"

      # AppDir

      - name: Prepare AppDir
        working-directory: gamypad_pc
        run: |
          rm -rf AppDir
          mkdir -p AppDir/usr/bin

          cp -a build/linux/x64/release/bundle/. AppDir/usr/bin/
          cp assets/icon.png AppDir/gamypad.png

          cat > AppDir/gamypad.desktop <<'EOF'
          [Desktop Entry]
          Name=Gamypad
          Comment=Android gamepad over UDP
          Exec=gamypad_pc
          Icon=gamypad
          Terminal=false
          Type=Application
          Categories=Game;Utility;
          EOF

          desktop-file-validate AppDir/gamypad.desktop

      # Bundle dependencies

      - name: Bundle Linux dependencies
        working-directory: gamypad_pc
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          linuxdeploy \
            --appdir AppDir \
            --executable AppDir/usr/bin/gamypad_pc \
            --desktop-file AppDir/gamypad.desktop \
            --icon-file AppDir/gamypad.png \
            --plugin gtk

          test -e AppDir/AppRun
          test -f AppDir/usr/bin/gamypad_pc

      # AppImage

      - name: Package Linux AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          ARTIFACT_SUFFIX: ${{ steps.meta.outputs.artifact_suffix }}
        run: |
          APPIMAGE_NAME="Gamypad-${ARTIFACT_SUFFIX}-x86_64.AppImage"

          ARCH=x86_64 tools/appimagetool \
            gamypad_pc/AppDir \
            "release-assets/$APPIMAGE_NAME"

          chmod +x "release-assets/$APPIMAGE_NAME"

      # Android build

      - name: Get Android dependencies
        working-directory: gamypad_controller
        run: flutter pub get

      - name: Build Android APK and AAB
        working-directory: gamypad_controller
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD_NUMBER: ${{ steps.meta.outputs.build_number }}
          ARTIFACT_SUFFIX: ${{ steps.meta.outputs.artifact_suffix }}
        run: |
          flutter build apk \
            --release \
            --build-name="$VERSION" \
            --build-number="$BUILD_NUMBER"

          flutter build appbundle \
            --release \
            --build-name="$VERSION" \
            --build-number="$BUILD_NUMBER"

          cp build/app/outputs/flutter-apk/app-release.apk \
            "../release-assets/Gamypad-Android-${ARTIFACT_SUFFIX}.apk"

          cp build/app/outputs/bundle/release/app-release.aab \
            "../release-assets/Gamypad-Android-${ARTIFACT_SUFFIX}.aab"

      # Checksums

      - name: Generate MD5 checksums
        working-directory: release-assets
        run: |
          md5sum *.AppImage *.apk *.aab > MD5SUMS.txt
          cat MD5SUMS.txt

      # CI artifacts

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gamypad-${{ steps.meta.outputs.artifact_suffix }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

      # GitHub Release

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: Gamypad ${{ steps.meta.outputs.version }}
          files: release-assets/*
          generate_release_notes: true
          prerelease: ${{ contains(steps.meta.outputs.version, '-') }}
          fail_on_unmatched_files: true
