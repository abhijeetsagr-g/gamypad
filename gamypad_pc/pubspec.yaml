name: gamypad_pc
description: Linux half of Gamypad — receives input over UDP and emulates an Xbox 360 controller via uinput.
publish_to: 'none'

# Keep in sync with ../gamypad_controller/pubspec.yaml — the two halves must
# ship matching versions because they share a wire protocol.
version: 1.2.0+1

environment:
  sdk: ^3.10.0-162.1.beta

dependencies:
  ffi: ^2.1.4
  flutter:
    sdk: flutter
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # Referenced by dist/install.sh for the .desktop entry Icon= path.
    - assets/icon.png
